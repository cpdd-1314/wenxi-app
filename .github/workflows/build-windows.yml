name: Build Windows

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          channel: stable
          cache: true

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.7'

      - name: Build gopeed helper
        shell: pwsh
        run: |
          $env:GOOS='windows'; $env:GOARCH='amd64'; $env:CGO_ENABLED='0'
          $env:GOTOOLCHAIN='go1.24.7'
          Push-Location native/gopeed
          go build -tags nosqlite -trimpath `
            -ldflags "-s -w -checklinkname=0 -H=windowsgui -X github.com/GopeedLab/gopeed/pkg/base.Version=1.8.1" `
            -o ../bin/asterlink_gopeed.exe ./cmd/asterlink
          Pop-Location

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Pub get
        run: flutter pub get

      - name: Build Windows
        run: flutter build windows --release

      - name: Package
        shell: pwsh
        run: |
          $dst = "asterlink-windows-x64.zip"
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath $dst
          Get-FileHash $dst

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: asterlink-windows-x64
          path: asterlink-windows-x64.zip

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: asterlink-windows-x64.zip
